# Render Blueprint Specification
# Docs: https://render.com/docs/blueprint-spec

services:
  # Primary: Render Static Site (Edge CDN hosting — NEVER sleeps, 0ms instant loading, no cold start)
  - type: web
    name: study-and-work-australia
    runtime: static
    plan: free
    buildCommand: ""
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /styles.css*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /app.js*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /*.mp4
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /www.studyandwork.com.au/*
        name: Cache-Control
        value: public, max-age=86400

